# Standalone deployment. Select with COMPOSE_FILE=compose.production.yaml in .env.
# Manual startup builds from source. Actions sets APP_PULL_POLICY=always to pull
# the tested, published commit images instead (no source build on the server).
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [siga]
    restart: unless-stopped

  database-setup:
    image: postgres:17.6
    user: "0:0"
    entrypoint: ["bash", "/bootstrap/init-keycloak.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./docker/postgres/init-keycloak.sh:/bootstrap/init-keycloak.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [siga]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_URL:?Set PUBLIC_URL}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      FRONTEND_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:?Set KEYCLOAK_REGISTRATION_CLIENT_SECRET}
    volumes:
      - ./docker/keycloak/siga-realm.json:/opt/keycloak/data/import/siga-realm.json:ro
    depends_on:
      database-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3; read -r status <&3; [[ \"$$status\" == *'200 OK'* ]]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [siga]
    restart: unless-stopped

  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.4.0
    entrypoint: ["bash", "/opt/keycloak/setup-registration.sh"]
    environment:
      KEYCLOAK_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: siga
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:?Set KEYCLOAK_REGISTRATION_CLIENT_SECRET}
    volumes:
      - ./docker/keycloak/setup-registration.sh:/opt/keycloak/setup-registration.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks: [siga]

  backend: &backend
    image: ${BACKEND_IMAGE:-siga-ipt-backend:local}
    build: ./backend
    pull_policy: ${APP_PULL_POLICY:-build}
    deploy:
      replicas: 3
    environment: &backend_environment
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      JPA_DDL_AUTO: validate
      JWT_ISSUER_URI: ${PUBLIC_URL:?Set PUBLIC_URL}/auth/realms/siga
      JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/siga/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL}
      SELF_REGISTRATION_ENABLED: "false"
      TEACHER_SELF_REGISTRATION_ENABLED: "false"
      KEYCLOAK_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: siga
      KEYCLOAK_REGISTRATION_CLIENT_ID: siga-backend-registration
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:?Set KEYCLOAK_REGISTRATION_CLIENT_SECRET}
      KEYCLOAK_REQUEST_TIMEOUT_SECONDS: ${KEYCLOAK_REQUEST_TIMEOUT_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
      backend-schema:
        condition: service_completed_successfully
      demo-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [siga]
    restart: unless-stopped

  backend-schema:
    <<: *backend
    command: ["--app.initialize-schema=true", "--server.port=0"]
    deploy:
      replicas: 1
    environment:
      <<: *backend_environment
      JPA_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"

  frontend:
    image: ${FRONTEND_IMAGE:-siga-ipt-frontend:local}
    build: ./frontend
    pull_policy: ${APP_PULL_POLICY:-build}
    environment:
      API_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/api
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/auth
      KEYCLOAK_REALM: siga
      KEYCLOAK_FRONTEND_CLIENT_ID: siga-frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [siga]
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount both live/ symlinks and their archive/ targets for Certbot renewals.
      - type: bind
        source: ${LETSENCRYPT_DIRECTORY:-/etc/letsencrypt}
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [siga]
    restart: unless-stopped

  demo-bootstrap:
    image: ${DATA_IMPORT_IMAGE:-siga-ipt-data-import:local}
    build: ./docker/data-import
    pull_policy: ${APP_PULL_POLICY:-build}
    entrypoint: ["node", "bootstrap.mjs"]
    environment:
      DEMO_SETUP_ENABLED: ${DEMO_SETUP_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: siga
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      backend-schema:
        condition: service_completed_successfully
    networks: [siga]
    restart: "no"

  demo-data:
    profiles: [tools]
    build: ./docker/data-import
    image: siga-ipt-data-import:local
    entrypoint: ["node", "demo-setup.mjs"]
    environment:
      DEMO_SETUP_ENABLED: ${DEMO_SETUP_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_FRONTEND_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: siga
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    networks: [siga]

networks:
  siga:
volumes:
  postgres_data:
