services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-keycloak.sh:/docker-entrypoint-initdb.d/init-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [siga]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in .env}
      KC_HEALTH_ENABLED: "true"
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:?Set KEYCLOAK_REGISTRATION_CLIENT_SECRET in .env}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:?Set KEYCLOAK_PORT in .env}:8080"
    volumes:
      - ./docker/keycloak/siga-realm.json:/opt/keycloak/data/import/siga-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; read -r status <&3; [[ \"$$status\" == *'200 OK'* ]]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [siga]

  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.4.0
    entrypoint: ["bash", "/opt/keycloak/setup-registration.sh"]
    environment:
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: siga
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:?Set KEYCLOAK_REGISTRATION_CLIENT_SECRET in .env}
    volumes:
      - ./docker/keycloak/setup-registration.sh:/opt/keycloak/setup-registration.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks: [siga]

  backend:
    image: siga-ipt-backend:local
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:?Set JPA_DDL_AUTO in .env}
      JWT_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in .env}/realms/siga
      JWT_JWK_SET_URI: http://keycloak:8080/realms/siga/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      SELF_REGISTRATION_ENABLED: ${SELF_REGISTRATION_ENABLED:?Set SELF_REGISTRATION_ENABLED in .env}
      TEACHER_SELF_REGISTRATION_ENABLED: ${TEACHER_SELF_REGISTRATION_ENABLED:?Set TEACHER_SELF_REGISTRATION_ENABLED in .env}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: siga
      KEYCLOAK_REGISTRATION_CLIENT_ID: siga-backend-registration
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:?Set KEYCLOAK_REGISTRATION_CLIENT_SECRET in .env}
      KEYCLOAK_REQUEST_TIMEOUT_SECONDS: ${KEYCLOAK_REQUEST_TIMEOUT_SECONDS:?Set KEYCLOAK_REQUEST_TIMEOUT_SECONDS in .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:?Set BACKEND_PORT in .env}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [siga]

networks:
  siga:
volumes:
  postgres_data:
