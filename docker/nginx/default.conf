# Docker DNS updates the upstream after a backend container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

log_format upstream_requests '$remote_addr "$request" $status upstream=$upstream_addr';
access_log /var/log/nginx/access.log upstream_requests;

upstream academic_backend {
    zone academic_backend 64k;
    # Docker resolves the service name to its three replicas. Default: round robin.
    server backend:8080 resolve;
}

upstream academic_frontend {
    zone academic_frontend 64k;
    server frontend:5173 resolve;
}

upstream academic_identity {
    zone academic_identity 64k;
    server keycloak:8080 resolve;
}

server {
    listen 80;
    server_name sigarojas.duckdns.org;
    return 308 https://sigarojas.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name sigarojas.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/sigarojas.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigarojas.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";

    # No trailing URI: preserve /api and /auth, including query parameters.
    location /api/ {
        proxy_pass http://academic_backend;
    }

    location = /auth {
        return 308 /auth/;
    }

    location /auth/ {
        proxy_pass http://academic_identity;
    }

    location / {
        proxy_pass http://academic_frontend;
    }
}
