spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
server.error.include-message=never
server.error.include-stacktrace=never
app.registration.enabled=${SELF_REGISTRATION_ENABLED}
app.registration.teacher-enabled=${TEACHER_SELF_REGISTRATION_ENABLED}
app.keycloak.server-url=${KEYCLOAK_SERVER_URL}
app.keycloak.realm=${KEYCLOAK_REALM}
app.keycloak.registration-client-id=${KEYCLOAK_REGISTRATION_CLIENT_ID}
app.keycloak.registration-client-secret=${KEYCLOAK_REGISTRATION_CLIENT_SECRET}
app.keycloak.request-timeout-seconds=${KEYCLOAK_REQUEST_TIMEOUT_SECONDS}
